[workspace]
members = ["crates/*", "examples"]
resolver = "3"

[workspace.package]
authors = ["Augentic"]
categories = ["wasm", "web-programming", "asynchronous"]
edition = "2024"
homepage = "https://augentic.io"
keywords = ["omnia", "wasi", "wasm", "component-model", "ext"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/omnia-ext"
rust-version = "1.99"
version = "0.36.0"

[workspace.lints.rust]
meta_variable_misuse = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# cherry-picked `restriction`s
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
dbg_macro = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
fn_to_numeric_cast_any = "warn"
map_err_ignore = "warn"
print_stderr = "warn"
print_stdout = "warn"
unused_result_ok = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["json"] }
base64ct = { version = "1.8.3", features = ["std"] }
bytes = "1.12.1"
chrono = "0.4.45"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-util = "0.1.21"
sea-query = { version = "1.0.2", default-features = false, features = ["thread-safe", "with-chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tower = "0.5.3"
tracing = "0.1.44"
wasip3 = { version = "0.9.0", features = ["http-compat"] }

omnia = "0.38.0"
omnia-sdk = { version = "0.38.0", default-features = false }
omnia-test = { version = "0.38.0", default-features = false }
omnia-wasi-config = "0.38.0"
omnia-wasi-http = "0.38.0"
omnia-wasi-keyvalue = "0.38.0"
omnia-wasi-otel = "0.38.0"
omnia-wasi-sql = "0.38.0"

omnia-dapr = { path = "crates/dapr", version = "0.36.0" }
omnia-http-cache = { path = "crates/http-cache", version = "0.36.0" }
omnia-orm = { path = "crates/orm", version = "0.36.0" }

[patch.crates-io]
# omnia = { git = "https://github.com/augentic/omnia" }
# omnia-sdk = { git = "https://github.com/augentic/omnia" }
# omnia-test = { git = "https://github.com/augentic/omnia" }
# omnia-wasi-config = { git = "https://github.com/augentic/omnia" }
# omnia-wasi-http = { git = "https://github.com/augentic/omnia" }
# omnia-wasi-keyvalue = { git = "https://github.com/augentic/omnia" }
# omnia-wasi-otel = { git = "https://github.com/augentic/omnia" }
# omnia-wasi-sql = { git = "https://github.com/augentic/omnia" }

omnia = { path = "../omnia/crates/omnia" }
omnia-sdk = { path = "../omnia/crates/sdk" }
omnia-test = { path = "../omnia/crates/test" }
omnia-wasi-config = { path = "../omnia/crates/wasi-config" }
omnia-wasi-http = { path = "../omnia/crates/wasi-http" }
omnia-wasi-keyvalue = { path = "../omnia/crates/wasi-keyvalue" }
omnia-wasi-otel = { path = "../omnia/crates/wasi-otel" }
omnia-wasi-sql = { path = "../omnia/crates/wasi-sql" }

[profile.release]
lto = true
opt-level = "s"
strip = true
