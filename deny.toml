# https://embarkstudios.github.io/cargo-deny

[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
exclude = ["examples"]
exclude-dev = true

[output]
feature-depth = 1

[advisories]
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono soft-deprecated; workspace migration to jiff is planned" },
]


[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
]

[licenses.private]
ignore = true

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[sources]
allow-git = [
  "https://github.com/augentic/omnia",
]
private = [
]

[bans]
deny = [
  { name = "tokio", deny-multiple-versions = true },
  { name = "wasmtime" },
  { name = "omnia-core" },
]
multiple-versions = "allow"
skip = []
skip-tree = []
wildcards = "allow"

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
# `exclude-dev = true` and `exclude = ["examples"]` prune dev-only and
# example-only workspace dependencies from the graph.
unused = "allow"
