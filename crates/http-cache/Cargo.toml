[package]
name = "omnia-http-cache"
description = "HTTP response cache over omnia:keyvalue for Omnia guests"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
http.workspace = true
omnia-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true

# The e2e suite (`tests/cache.rs`): the `test-programs` guests booted
# in-process over `omnia_test::host`. Target-gated so the guest's wasm32
# dependency graph never sees the host.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
omnia.workspace = true
omnia-test = { workspace = true, features = ["host"] }
omnia-wasi-http.workspace = true
omnia-wasi-keyvalue.workspace = true
omnia-wasi-otel.workspace = true
serde_json.workspace = true
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
