[package]
name = "test-programs"
description = "Guest scenario programs driven by the extension e2e suites, and their compiled artifacts"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
autoexamples = false

[lints]
workspace = true

# The guest side: `build.rs` (through `omnia_test::build`) compiles every
# `programs/<crate>/<scenario>.rs` as an `[[example]]` cdylib for
# `wasm32-wasip3`, and only the programs reach these. The native side has no
# dependencies: it is the generated artifact paths alone.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
bytes.workspace = true
http.workspace = true
omnia-http-cache.workspace = true
omnia-sdk = { workspace = true, features = ["command"] }

[build-dependencies]
omnia-test = { workspace = true, features = ["build"] }

# Generated by build.rs from programs/<group>/<scenario>.rs.

[[example]]
name = "http_cache_headers"
path = "programs/http_cache/headers.rs"
crate-type = ["cdylib"]

[[example]]
name = "http_cache_outage"
path = "programs/http_cache/outage.rs"
crate-type = ["cdylib"]
