[package]
name = "examples"
publish = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
omnia.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-otel.workspace = true
omnia-wasi-sql.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
omnia-orm.workspace = true
omnia-sdk = { workspace = true, features = ["http"] }
serde.workspace = true
serde_json.workspace = true

# The component rung (`tests/orm.rs`): the example runtime booted in-process
# over `omnia_test::host::Backends`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
omnia-test = { workspace = true, features = ["host"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

# The fixture rung: `build.rs` compiles the example guest to a
# `wasm32-wasip3` component for the tests to boot.
[build-dependencies]
omnia-test = { workspace = true, features = ["build"] }

[lints]

[[example]]
name = "orm-wasm"
path = "orm/guest.rs"
crate-type = ["cdylib"]

[[example]]
name = "orm"
path = "orm/runtime.rs"
